{{- if .Values.zen.zen.zenCustomRoute.route_host }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpd-route-patcher
  namespace: {{ .Values.global.instanceNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cpd-route-patcher
  namespace: {{ .Values.global.instanceNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpd-route-patcher
  namespace: {{ .Values.global.instanceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cpd-route-patcher
subjects:
  - kind: ServiceAccount
    name: cpd-route-patcher
    namespace: {{ .Values.global.instanceNamespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cpd-route-patch-job
  namespace: {{ .Values.global.instanceNamespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: cpd-route-patcher
      restartPolicy: OnFailure
      containers:
        - name: patcher
          image: icr.io/cpopen/cpd/olm-utils-v4:5.3.1
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for internal-tls secret..."
              until oc get secret internal-tls -n {{ .Values.global.instanceNamespace }} &>/dev/null; do sleep 5; done

              echo "Waiting for cpd route..."
              until oc get route cpd -n {{ .Values.global.instanceNamespace }} &>/dev/null; do sleep 5; done

              echo "Extracting CA cert..."
              CA_CERT=$(oc get secret internal-tls -n {{ .Values.global.instanceNamespace }} \
                -o jsonpath='{.data.tls\.crt}' | base64 -d)

              echo "Patching route with destinationCACertificate..."
              oc patch route cpd -n {{ .Values.global.instanceNamespace }} \
                --type=merge \
                -p "{\"spec\":{\"tls\":{\"destinationCACertificate\":\"$(echo "$CA_CERT" | awk '{printf "%s\\n", $0}')\"}}}"

              echo "Done."
{{- end }}
