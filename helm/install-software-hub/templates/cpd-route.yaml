{{- if .Values.zen.zen.zenCustomRoute.route_host }}
{{- $host := .Values.zen.zen.zenCustomRoute.route_host }}
{{- $ns := .Values.global.instanceNamespace }}
---
# Catch-all: main CPD UI via ibm-nginx
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cpd
  namespace: {{ $ns }}
  annotations:
    haproxy.router.openshift.io/timeout: 90s
spec:
  host: {{ $host }}
  port:
    targetPort: 8443
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: ibm-nginx-svc
    weight: 100
  wildcardPolicy: None
---
# /idprovider/ -> platform-identity-provider:4300
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cpd-idprovider
  namespace: {{ $ns }}
  annotations:
    haproxy.router.openshift.io/timeout: 3600s
spec:
  host: {{ $host }}
  path: /idprovider
  port:
    targetPort: 4300
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: platform-identity-provider
    weight: 100
  wildcardPolicy: None
---
