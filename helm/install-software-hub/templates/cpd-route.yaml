{{- if .Values.zen.zen.zenCustomRoute.route_host }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cpd
  namespace: {{ .Values.global.instanceNamespace }}
  annotations:
    haproxy.router.openshift.io/timeout: 90s
spec:
  host: {{ .Values.zen.zen.zenCustomRoute.route_host }}
  port:
    targetPort: 443
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: ibm-nginx-svc
    weight: 100
  wildcardPolicy: None
{{- end }}
