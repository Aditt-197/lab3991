apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-software-hub-student1
  namespace: openshift-gitops
spec:
  project: default

  source:
    repoURL: https://github.com/Aditt-197/lab3991.git
    targetRevision: main
    path: helm/install-software-hub
    helm:
      releaseName: software-hub-student1
      valueFiles:
        - ../../overrides/student1/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cpd-student1

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=false
