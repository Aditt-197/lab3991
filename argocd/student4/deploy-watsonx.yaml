apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-watsonx-student4
  namespace: openshift-gitops
spec:
  project: default

  sources:
    - repoURL: https://github.com/Aditt-197/lab3991.git
      targetRevision: main
      path: helm/install-watsonx
      helm:
        releaseName: watsonx-student4
        valueFiles:
          - $overrides/overrides/student4/values.yaml
    - repoURL: https://github.com/Aditt-197/lab3991.git
      targetRevision: main
      ref: overrides

  destination:
    server: https://kubernetes.default.svc
    namespace: cpd-student4

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=false
